<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4e735e"><meta name="description" content="Một buổi sáng trong khu chợ Việt 3D. Chọn hàng, trả giá, giao đơn và tích lũy để mở sạp của riêng mình."><title>Bình An · Thành phố lập nghiệp</title><link rel="stylesheet" href="style3d.css"></head>
<body><header><a class="brand" href="./">BÌNH AN<small>THÀNH PHỐ LẬP NGHIỆP</small></a><span class="version">3D · BẢN CHƠI THỬ</span><button id="inventory" aria-expanded="false">Giỏ của con</button><button id="reset" title="Về điểm xuất phát">↻</button></header><main><section class="intro"><div class="wallet"><small>TIỀN TRONG VÍ</small><strong id="money">150.000đ</strong></div></section><div class="layout"><section class="market"><section class="shopping-mini" aria-label="Danh sách cần mua"><div class="mini-title"><strong>Bữa cơm nhà</strong><span id="miniCount">0/4</span></div><ul id="miniList"></ul><p id="miniNext">Đi theo dấu vàng để làm đơn hàng.</p></section><div class="scene" id="scene"><div id="stalls" hidden></div><button id="home" class="home" hidden>Về nhà</button><div id="loading3d"><strong>CHỢ BÌNH AN</strong><span>Đang mở cửa chợ…</span></div></div></section><aside aria-label="Giỏ đồ"><div class="note"><h2>Trong giỏ của con</h2><p>Mua đủ món rồi giao đúng người nhận.</p><ul id="list"></ul><div class="progress"><i id="bar"></i></div><small id="count"></small></div><div class="bag"><h3>Giỏ hàng <span id="bagcount">0 món</span></h3><p id="bag"></p></div></aside></div></main><dialog id="shop"><button class="close" id="close" aria-label="Đóng">×</button><div id="dialogContent"></div></dialog><div id="toast" role="status"></div>
